<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Classes</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-slate-50 font-[Poppins]">

<div class="ml-64 flex-1 p-8">

<!-- Sidebar -->

<aside class="fixed left-0 top-0 w-64 h-screen bg-white shadow-lg z-50">

<div class="p-6 border-b">

<img src="assets/logo.svg" alt="BQ Trainer System" class="h-10">

</div>

<nav class="mt-6">

<a href="dashboard.html"
class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">

<i class="fa-solid fa-house"></i>

Dashboard

</a>

<a href="timetable.html"
class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">

<i class="fa-solid fa-calendar"></i>

Timetable

</a>

<a href="classes.html"
class="flex gap-3 items-center px-6 py-3 bg-blue-500 text-white">

<i class="fa-solid fa-book"></i>

My Classes

</a>

<a href="students.html"
class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">

<i class="fa-solid fa-users"></i>

Students

</a>

<a href="attendance.html"
class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">

<i class="fa-solid fa-clipboard-check"></i>

Attendance

</a>


<a href="#" onclick="localStorage.removeItem('currentTrainer');window.location.href='index.html';return false;"
class="flex gap-3 items-center px-6 py-3 hover:bg-red-50 text-red-500">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</a>

</nav>

</aside>

<!-- Main -->

<div class="flex-1 p-8">

<div class="flex justify-between items-center mb-6">

<h1 class="text-3xl font-bold text-blue-500">

My Classes

</h1>

<input
id="searchClass"
type="text"
placeholder="Search class..."
class="border rounded-lg px-4 py-2 w-72">

</div>

<div
id="classContainer"
class="grid grid-cols-2 gap-6">

</div>


<!-- Students Modal -->

<div id="studentModal"
class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">


<div class="bg-white rounded-xl p-6 w-[500px]">


<div class="flex justify-between items-center">


<h2 class="text-2xl font-bold text-blue-500">

Class Students

</h2>


<button id="closeModal">

<i class="fa-solid fa-xmark text-xl"></i>

</button>


</div>


<div id="classStudents"
class="mt-5 space-y-3">


</div>


</div>


</div>

</div>

</div>

<script>
if(!localStorage.getItem("currentTrainer")){
    window.location.href="index.html";
}
</script>
<script src="js/classes.js"></script>

</body>

</html>
