<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details | BQ Trainer System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-50 font-[Poppins]">
    <div class="ml-64 flex-1 p-8">
        <aside class="fixed left-0 top-0 w-64 h-screen bg-white shadow-lg z-50">
            <div class="p-6 border-b">
                <img src="assets/logo.svg" alt="BQ Trainer System" class="h-10">
            </div>
            <nav class="mt-6">
                <a href="dashboard.html" class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">
                    <i class="fa-solid fa-house"></i> Dashboard
                </a>
                <a href="timetable.html" class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">
                    <i class="fa-solid fa-calendar"></i> Timetable
                </a>
                <a href="classes.html" class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">
                    <i class="fa-solid fa-book"></i> My Classes
                </a>
                <a href="students.html" class="flex gap-3 items-center px-6 py-3 bg-blue-500 text-white">
                    <i class="fa-solid fa-users"></i> Students
                </a>
                <a href="attendance.html" class="flex gap-3 items-center px-6 py-3 hover:bg-blue-100">
                    <i class="fa-solid fa-clipboard-check"></i> Attendance
                </a>
                <a href="#" onclick="localStorage.removeItem('currentTrainer');window.location.href='index.html';return false;"
                    class="flex gap-3 items-center px-6 py-3 hover:bg-red-50 text-red-500">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </nav>
        </aside>

        <div class="flex-1 p-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <a href="students.html" class="text-blue-500 hover:underline mb-2 inline-block">
                        <i class="fa-solid fa-arrow-left"></i> Back to Students
                    </a>
                    <h1 class="text-3xl font-bold text-blue-500 mt-1">Student Details</h1>
                </div>
                <div class="flex gap-3">
                    <button id="editStudentBtn" class="bg-green-500 hover:bg-green-600 text-white px-5 py-3 rounded-lg">
                        <i class="fa-solid fa-pen"></i> Edit
                    </button>
                    <button id="deleteStudentBtn" class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-lg">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                </div>
            </div>

            <!-- Profile Card -->
            <div class="bg-white rounded-xl shadow p-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-gray-500 text-sm">Student ID</label>
                        <p id="studentId" class="text-xl font-bold text-blue-500">-</p>
                    </div>
                    <div>
                        <label class="text-gray-500 text-sm">Full Name</label>
                        <p id="studentName" class="text-xl font-bold">-</p>
                    </div>
                    <div>
                        <label class="text-gray-500 text-sm">Contact</label>
                        <p id="studentContact" class="font-medium">-</p>
                    </div>
                    <div>
                        <label class="text-gray-500 text-sm">Gender</label>
                        <p id="studentGender" class="font-medium">-</p>
                    </div>
                    <div>
                        <label class="text-gray-500 text-sm">Enrolled Class</label>
                        <p id="studentClass" class="font-medium text-blue-500">-</p>
                    </div>
                    <div>
                        <label class="text-gray-500 text-sm">Status</label>
                        <p id="studentStatus" class="font-medium text-green-600">-</p>
                    </div>
                </div>
            </div>

            <!-- Attendance Summary -->
            <div class="grid grid-cols-4 gap-6 mt-6">
                <div class="bg-green-50 rounded-xl shadow p-5 text-center">
                    <p class="text-gray-600">Present</p>
                    <h2 id="present" class="text-3xl font-bold text-green-600">0</h2>
                </div>
                <div class="bg-red-50 rounded-xl shadow p-5 text-center">
                    <p class="text-gray-600">Absent</p>
                    <h2 id="absent" class="text-3xl font-bold text-red-600">0</h2>
                </div>
                <div class="bg-yellow-50 rounded-xl shadow p-5 text-center">
                    <p class="text-gray-600">Leave</p>
                    <h2 id="leave" class="text-3xl font-bold text-yellow-600">0</h2>
                </div>
                <div class="bg-blue-50 rounded-xl shadow p-5 text-center">
                    <p class="text-gray-600">Attendance %</p>
                    <h2 id="percentage" class="text-3xl font-bold text-blue-600">0%</h2>
                </div>
            </div>

            <!-- Attendance History -->
            <div class="bg-white rounded-xl shadow mt-6 p-6">
                <h2 class="text-2xl font-bold text-blue-500 mb-4">Attendance History</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-center">
                        <thead class="bg-blue-500 text-white">
                            <tr>
                                <th class="p-3">Date</th>
                                <th class="p-3">Class</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceHistory">
                            <tr>
                                <td colspan="3" class="p-6 text-gray-500">No attendance record available.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        if(!localStorage.getItem("currentTrainer")){
            window.location.href="index.html";
        }
    </script>
    <script src="js/student-details.js"></script>
</body>
</html>
