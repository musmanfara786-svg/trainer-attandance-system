<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 flex justify-center items-center min-h-screen">

<div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <div class="text-center mb-8">

        <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto flex items-center justify-center text-white text-3xl">
            <i class="fa-solid fa-user-tie"></i>
        </div>

        <h1 class="text-3xl font-bold text-blue-500 mt-4">
            Trainer Login
        </h1>

        <p class="text-gray-500 mt-2">
            Trainer Attendance Management System
        </p>

    </div>


    <form id="loginForm">

        <div class="mb-5">

            <label class="font-medium">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                class="w-full mt-2 border rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-400 outline-none">

        </div>


        <div class="mb-4">

            <label class="font-medium">
                Password
            </label>

            <div class="relative mt-2">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    class="w-full border rounded-lg px-4 py-3 pr-12 focus:ring-2 focus:ring-blue-400 outline-none">

                <button
                    type="button"
                    id="togglePassword"
                    class="absolute right-4 top-3 text-gray-500">

                    <i class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>


        <div class="mb-5 flex items-center">

            <input type="checkbox" id="showPass">

            <label for="showPass" class="ml-2 text-gray-600">
                Show Password
            </label>

        </div>

        <p id="error" class="text-red-500 text-sm mb-4"></p>

        <button
            class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg duration-300">

            Login

        </button>

    </form>

</div>

<script src="js/auth.js"></script>

</body>
</html>
